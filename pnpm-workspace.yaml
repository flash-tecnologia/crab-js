packages:
  - packages/*
  - benchmarks/*
  - examples/*

allowBuilds:
  esbuild: true
  fallow: true
  protobufjs: true

catalog:
  '@emnapi/core': 2.0.0-alpha.4
  '@emnapi/runtime': 2.0.0-alpha.4
  '@napi-rs/cli': 3.9.1
  '@napi-rs/wasm-runtime': 1.2.4
  '@types/node': 26.5.1
  emnapi: 2.0.0-alpha.4
  'nanoid': 6.0.1
  '@faker-js/faker': 10.6.0
  '@opentelemetry/api': 1.9.0
  '@opentelemetry/context-async-hooks': 2.5.1
  '@opentelemetry/core': 2.5.1
  '@opentelemetry/semantic-conventions': 1.38.0
  '@opentelemetry/resources': 1.30.1
  '@opentelemetry/sdk-metrics': 1.30.1
  '@opentelemetry/sdk-trace-base': 1.30.1
  '@opentelemetry/sdk-trace-node': 1.30.1
  '@opentelemetry/exporter-metrics-otlp-grpc': 0.57.2
  '@opentelemetry/exporter-trace-otlp-grpc': 0.57.2
  '@opentelemetry/sdk-node': 0.57.2

overrides:
  vite: npm:@voidzero-dev/vite-plus-core@0.3.1
  vitest: 4.1.11

peerDependencyRules:
  allowedVersions:
    # Vite+ replaces Vite with its bundled core, which uses the Vite+ version.
    'vitest@4.1.11>vite': '0.3.1'
    '@vitest/mocker@4.1.11>vite': '0.3.1'

supportedArchitectures:
  cpu:
    - current
    - wasm32

onlyBuiltDependencies:
  - '@platformatic/rdkafka'
  - dprint
  - esbuild
  - protobufjs

minimumReleaseAgeExclude:
  - '@napi-rs/wasm-runtime@1.2.4'
  - tsx@4.23.13
  - '@napi-rs/cli@3.9.1'
