name: Validate static IP release runner

'on':
  push:
    branches:
      - codex/npm-trusted-publishing
    paths:
      - .github/workflows/runner-diagnostics.yml

permissions:
  contents: read

jobs:
  validate-runner:
    runs-on: flash-static-ip-ubuntu-24
    timeout-minutes: 5
    steps:
      - name: Verify GitHub-hosted environment
        env:
          RUNNER_KIND: ${{ runner.environment }}
        run: |
          echo "Runner environment: $RUNNER_KIND"
          echo "Runner OS: $RUNNER_OS"
          test "$RUNNER_KIND" = github-hosted
          test "$RUNNER_OS" = Linux
      - name: Verify authenticated GitHub API access
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY" --jq .full_name
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=1" --jq 'length'
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Verify npm registry access
        run: npm view kafka-crab-js version
