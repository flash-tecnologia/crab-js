name: CI OTEL

permissions:
  contents: read

'on':
  push:
    tags:
      - 'kafka-crab-js-otel@*'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - LICENSE
      - '**/*.gitignore'
      - .editorconfig
      - docs/**

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-otel:
    name: Validate kafka-crab-js-otel
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      kafka:
        image: apache/kafka:3.8.0
        ports:
          - 9092:9092
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
          CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 12
    steps:
      - uses: actions/checkout@v6
      - name: Setup pnpm from packageManager
        uses: pnpm/action-setup@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/kafka-crab-js-otel@')
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          const { version } = JSON.parse(readFileSync('packages/kafka-crab-js-otel/package.json', 'utf8'))
          const expected = `refs/tags/kafka-crab-js-otel@${version}`
          if (process.env.GITHUB_REF !== expected) {
            throw new Error(`Release tag ${process.env.GITHUB_REF} does not match package version ${version}`)
          }
          NODE
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter kafka-crab-js-otel...
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build native Kafka client for integration tests
        run: pnpm --filter kafka-crab-js build
      - name: Check formatting
        run: pnpm --filter kafka-crab-js-otel fmt:check
      - name: Lint and typecheck
        run: pnpm --filter kafka-crab-js-otel lint
      - name: Unit tests
        run: pnpm --filter kafka-crab-js-otel test
      - name: Integration tests with required Kafka
        run: pnpm --filter kafka-crab-js-otel test:integration
        env:
          KAFKA_BROKERS: localhost:9092
          KAFKA_REQUIRED: 'true'
      - name: Build OTEL package
        run: pnpm --filter kafka-crab-js-otel build
      - name: Verify built entry points and instrumentation version
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { readFileSync } from 'node:fs'
          import { createRequire } from 'node:module'
          import * as esm from './packages/kafka-crab-js-otel/dist/index.js'
          const cjs = createRequire(import.meta.url)('./packages/kafka-crab-js-otel/dist/index.cjs')
          const manifest = JSON.parse(readFileSync('packages/kafka-crab-js-otel/package.json', 'utf8'))
          for (const api of [esm, cjs]) {
            assert.equal(api.PACKAGE_INFO.NAME, manifest.name)
            assert.equal(api.PACKAGE_INFO.VERSION, manifest.version)
            assert.equal(typeof api.enableOtelInstrumentation, 'function')
            assert.equal(typeof api.endSpan, 'function')
          }
          NODE
      - name: Pack release artifact
        working-directory: packages/kafka-crab-js-otel
        run: pnpm pack --pack-destination ../../artifacts/otel
      - name: Upload validated release artifact
        uses: actions/upload-artifact@v7
        with:
          name: kafka-crab-js-otel-release
          path: artifacts/otel/*.tgz
          if-no-files-found: error

  publish-otel:
    name: Publish validated kafka-crab-js-otel artifact
    if: startsWith(github.ref, 'refs/tags/kafka-crab-js-otel@')
    needs: validate-otel
    runs-on: crab-js-static-ip
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11
      - name: Download validated release artifact
        uses: actions/download-artifact@v8
        with:
          name: kafka-crab-js-otel-release
          path: artifacts/otel
      - name: Publish release artifact
        run: |
          VERSION=${GITHUB_REF#refs/tags/kafka-crab-js-otel@}
          if [[ $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            DIST_TAG=latest
          elif [[ $VERSION == *-alpha* ]]; then
            DIST_TAG=alpha
          elif [[ $VERSION == *-beta* ]]; then
            DIST_TAG=beta
          elif [[ $VERSION == *-rc* ]]; then
            DIST_TAG=rc
          else
            DIST_TAG=next
          fi
          npm publish "artifacts/otel/kafka-crab-js-otel-${VERSION}.tgz" \
            --tag "$DIST_TAG" --access public --provenance
